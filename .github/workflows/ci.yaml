name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          target: aarch64-unknown-linux-gnu
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The NEON kernels sit behind cfg(target_arch = "aarch64"), so the x86 steps above
      # never compile them. Without this step they are type-checked and linted by nothing
      # -- which is how they missed the 2024 edition migration.
      - name: Clippy (aarch64, compiles the NEON kernels)
        run: cargo clippy --target aarch64-unknown-linux-gnu --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.tier.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NPV dispatch picks the best tier the CPU supports, so a plain run only ever
        # exercises the runner's best one. The ENABLE_* overrides force the lower tiers
        # so the AVX and auto-vectorized kernels are covered too.
        tier:
          - { name: avx2, env: '' }
          - { name: avx, env: 'ENABLE_AVX2=0' }
          - { name: autovec, env: 'ENABLE_AVX2=0 ENABLE_AVX=0' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: ${{ matrix.tier.env }} cargo test --release

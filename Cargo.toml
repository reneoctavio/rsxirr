[package]
name = "pyxirr"
version = "0.10.6"
edition = "2024"
description = "Rust-powered collection of financial functions. Fork of pyxirr with the Python bindings removed."
readme = "README.md"
homepage = "https://github.com/reneoctavio/rsxirr"
repository = "https://github.com/reneoctavio/rsxirr"
license = "Unlicense"
keywords = [
    "fast",
    "financial",
    "xirr",
    "cashflow",
    "day count convention",
    "PME",
]
include = [
    "src/**",
    "Cargo.toml",
    "LICENSE",
]

[lib]
name = "pyxirr"
crate-type = ["rlib"]
doctest = false

[dependencies]
time = { version = "^0.3.41", features = ["parsing", "macros"] }

[dev-dependencies]
assert_approx_eq = "1.1"
criterion = "0.5"
csv = "1.3.1"
rstest = { version = "0.25.0", default-features = false }

[[bench]]
name = "npf"
harness = false

[[bench]]
name = "input"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "prefix_irr"
harness = false

[[bench]]
name = "npv_kernel"
harness = false

[[bench]]
name = "grid_fallback"
harness = false
